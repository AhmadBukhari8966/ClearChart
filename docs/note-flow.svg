<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="910" viewBox="0 0 1320 910" role="img" aria-labelledby="title desc">
<title id="title">02 - Save note and update tabs</title><desc id="desc">POST and long-lived GET are separate HTTP requests. The hub carries notifications, not patient records.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#62786d"/></marker></defs>
<rect width="100%" height="100%" fill="#fafcf9"/>
<text x="50" y="42" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#244536">ClearChart · 02 - Save note and update tabs</text>
<text x="50" y="68" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#52655b">POST and long-lived GET are separate HTTP requests. The hub carries notifications, not patient records.</text>
<polyline points="390,162.5 435,162.5 435,162.5 480,162.5" fill="none" stroke="#62786d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="820,162.5 865,162.5 865,162.5 910,162.5" fill="none" stroke="#62786d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
