<polyline points="480,365 435,365 435,365 390,365" fill="none" stroke="#62786d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="650,420 650,462.5 650,462.5 650,505" fill="none" stroke="#62786d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1080,420 1080,462.5 1080,462.5 1080,505" fill="none" stroke="#62786d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="820,555 865,555 865,555 910,555" fill="none" stroke="#62786d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1080,605 1080,650 1080,650 1080,695" fill="none" stroke="#62786d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="910,745 865,745 865,745 820,745" fill="none" stroke="#62786d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="480,745 435,745 435,745 390,745" fill="none" stroke="#62786d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="50" y="110" width="340" height="105" rx="12" fill="#e5f0e9" stroke="#3b7256" stroke-width="1.5"/>
<text x="220" y="145.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#243f32">1. Doctor submits form</text>
<text x="220" y="167.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">@post('/add-record', form)</text>
<text x="220" y="189.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">csrf + doctor_id + patient_id + view_id</text>
<rect x="480" y="110" width="340" height="105" rx="12" fill="#edf3f9" stroke="#5c7e9e" stroke-width="1.5"/>
<text x="650" y="145.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#243f32">2. addRecord()</text>
<text x="650" y="167.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">Parse → session/CSRF/origin checks</text>
<text x="650" y="189.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">Care-team check + validate content</text>
<rect x="910" y="110" width="340" height="105" rx="12" fill="#e5f0e9" stroke="#3b7256" stroke-width="1.5"/>
<text x="1080" y="145.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#243f32">3. Store.AddRecord()</text>
<text x="1080" y="167.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">memoryStore OR postgresStore</text>
<text x="1080" y="189.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">Persist and return saved Record</text>
<rect x="480" y="310" width="340" height="110" rx="12" fill="#edf3f9" stroke="#5c7e9e" stroke-width="1.5"/>
<text x="650" y="348" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#243f32">4. render('record', record)</text>
<text x="650" y="370" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">startSSE + patch('#timeline', prepend)</text>
<text x="650" y="392" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">writeCounts + feedback</text>
<rect x="50" y="310" width="340" height="110" rx="12" fill="#e5f0e9" stroke="#3b7256" stroke-width="1.5"/>
<text x="220" y="348" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#243f32">Authoring tab updates immediately</text>
<text x="220" y="370" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">Datastar applies POST response</text>
<text x="220" y="392" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">POST ends; existing GET stays open</text>
<rect x="910" y="310" width="340" height="110" rx="12" fill="#edf3f9" stroke="#5c7e9e" stroke-width="1.5"/>
<text x="1080" y="348" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#243f32">Other tabs already have GET /events</text>
<text x="1080" y="370" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">events(): authenticate + subscribe</text>
<text x="1080" y="392" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">Initial snapshot then wait</text>
<rect x="480" y="505" width="340" height="100" rx="12" fill="#edf3f9" stroke="#5c7e9e" stroke-width="1.5"/>
<text x="650" y="538" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#243f32">5. hub.publish(patientID, viewID)</text>
<text x="650" y="560" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">Nonblocking notification</text>
<text x="650" y="582" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">Same-view immediate echo skipped</text>
<rect x="910" y="505" width="340" height="100" rx="12" fill="#edf3f9" stroke="#5c7e9e" stroke-width="1.5"/>
<text x="1080" y="538" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#243f32">6. events() wakes</text>
<text x="1080" y="560" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">Relevant patient notification</text>
<text x="1080" y="582" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">OR 15-second timer</text>
<rect x="910" y="695" width="340" height="100" rx="12" fill="#edf3f9" stroke="#5c7e9e" stroke-width="1.5"/>
<text x="1080" y="728" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#243f32">7. dashboardData()</text>
<text x="1080" y="750" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">Recheck selected chart access</text>
<text x="1080" y="772" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">Read current Store data</text>
<rect x="480" y="695" width="340" height="100" rx="12" fill="#edf3f9" stroke="#5c7e9e" stroke-width="1.5"/>
<text x="650" y="728" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#243f32">8. snapshot() → patch()</text>
<text x="650" y="750" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">Timeline, reports/uploads, summary</text>
<text x="650" y="772" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">Healing and counts</text>
<rect x="50" y="695" width="340" height="100" rx="12" fill="#e5f0e9" stroke="#3b7256" stroke-width="1.5"/>
<text x="220" y="728" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#243f32">9. Other tabs update</text>
<text x="220" y="750" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">SSE HTML patches apply in place</text>
<text x="220" y="772" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">Patient sees doctor's saved note</text>
<rect x="50" y="505" width="340" height="100" rx="12" fill="#f2f4f5" stroke="#819098" stroke-width="1.5"/>
<text x="220" y="527" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#243f32">Transport boundaries</text>
<text x="220" y="549" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">HTTP actions send user changes</text>
<text x="220" y="571" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">SSE sends server changes</text>
<text x="220" y="593" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">Hub is local to this Go process</text>
<text x="50" y="890" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#697e70">Source: D:\projects\ClearChart · September 26, 2026 · See docs/README.md and function references for details.</text></svg>