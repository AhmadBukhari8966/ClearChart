<text x="220" y="718" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#243f32">8. Later live snapshots</text>
<text x="220" y="740" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">Same selected patient</text>
