<text x="220" y="328" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#243f32">6. doctorContext() on stream start</text>
<text x="220" y="350" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">#selected-patient-summary</text>
<text x="220" y="372" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">#health-timeline + #new-record</text>
