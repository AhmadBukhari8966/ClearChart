<text x="650" y="350" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">Validate role/session/profile</text>
<text x="650" y="372" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">dashboardData() checks care team</text>
