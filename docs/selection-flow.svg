<rect x="50" y="110" width="340" height="100" rx="12" fill="#e5f0e9" stroke="#3b7256" stroke-width="1.5"/>
<text x="220" y="143" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#243f32">1. Click patient anchor</text>
<text x="220" y="165" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">data-on:click__prevent</text>
<text x="220" y="187" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">Skip selection while saving note</text>
