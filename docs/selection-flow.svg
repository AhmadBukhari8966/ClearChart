<text x="1080" y="143" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#243f32">3. Root data-effect reruns</text>
<text x="1080" y="165" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">@get uses fixed /events/doctor URL</text>
