<text x="1080" y="520.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#243f32">Directory is NOT patched</text>
<text x="1080" y="542.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">Same node + same scrollTop</text>
<text x="1080" y="564.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">Page stays in same document</text>
