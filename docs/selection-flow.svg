<text x="650" y="898" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#243f32">Preserve this contract when extending the app</text>
<text x="650" y="920" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">Stable root + fixed action URL + patient-specific form IDs + scoped server checks</text>
<text x="650" y="942" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">The authoring POST response must never land in another patient's chart.</text>
