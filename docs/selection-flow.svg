<text x="220" y="542.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">Records + reports + healing</text>
<text x="220" y="564.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">AI summary + counts</text>
<rect x="480" y="485" width="340" height="105" rx="12" fill="#fff3df" stroke="#b17b2c" stroke-width="1.5"/>
<text x="650" y="520.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#243f32">Form IDs include patient UUID</text>
<text x="650" y="542.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">Draft clears on patient switch</text>
<text x="650" y="564.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">Old form disabled while selection pending</text>
