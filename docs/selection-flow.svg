<text x="650" y="143" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#243f32">2. $selectedpatient = patient UUID</text>
<text x="650" y="165" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">chosen class + aria-current update</text>
<text x="650" y="187" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">The page shell remains mounted</text>
