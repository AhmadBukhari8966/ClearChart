<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1110" viewBox="0 0 1320 1110" role="img" aria-labelledby="title desc">
<title id="title">04 - Database relationships</title><desc id="desc">All tables are in public. UUID identifiers link profiles; roles distinguish patients from doctors.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#62786d"/></marker></defs>
