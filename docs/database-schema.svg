<polyline points="660,270 660,337.5 215,337.5 215,405" fill="none" stroke="#62786d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="437.5" y="328.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#425749" stroke="#fafcf9" stroke-width="5" paint-order="stroke">patient_id</text>
<polyline points="660,270 660,337.5 1080,337.5 1080,405" fill="none" stroke="#62786d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="870" y="328.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#425749" stroke="#fafcf9" stroke-width="5" paint-order="stroke">doctor_id</text>
<polyline points="455,192.5 410,192.5 410,755 380,755" fill="none" stroke="#62786d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="413" y="635" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#425749" stroke="#fafcf9" stroke-width="5" paint-order="stroke">patient_id</text>
<polyline points="660,515 660,587.5 1080,587.5 1080,660" fill="none" stroke="#62786d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="870" y="578.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#425749" stroke="#fafcf9" stroke-width="5" paint-order="stroke">1 care pair → 0..many records</text>
<rect x="455" y="115" width="410" height="155" rx="12" fill="#e5f0e9" stroke="#3b7256" stroke-width="1.5"/>
<text x="660" y="153.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#243f32">profiles</text>
<text x="660" y="175.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">PK id; role = doctor | patient</text>
<text x="660" y="197.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">name, email (case-insensitive unique)</text>
<text x="660" y="219.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">doctor: license_num, specialization</text>
<text x="660" y="241.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">patient: dob, blood_type</text>
<rect x="455" y="405" width="410" height="110" rx="12" fill="#edf3f9" stroke="#5c7e9e" stroke-width="1.5"/>
<text x="660" y="432" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#243f32">care_team</text>
<text x="660" y="454" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">PK (patient_id, doctor_id)</text>
<text x="660" y="476" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">Both IDs reference profiles.id</text>
<text x="660" y="498" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">Triggers verify roles</text>
<rect x="905" y="660" width="350" height="155" rx="12" fill="#e5f0e9" stroke="#3b7256" stroke-width="1.5"/>
<text x="1080" y="698.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#243f32">medical_records</text>
<text x="1080" y="720.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">PK id; FK patient_id + doctor_id</text>
<text x="1080" y="742.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">Composite FK → care_team</text>
<text x="1080" y="764.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">type, content, timestamp, image_url</text>
<text x="1080" y="786.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">Existing records constrain unlinking</text>
<rect x="50" y="405" width="330" height="130" rx="12" fill="#edf3f9" stroke="#5c7e9e" stroke-width="1.5"/>
<text x="215" y="442" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#243f32">patient_uploads</text>
<text x="215" y="464" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">PK id; patient_id → profiles.id</text>
<text x="215" y="486" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">file_name, timestamp</text>
<text x="215" y="508" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">Filename metadata only</text>
<rect x="50" y="690" width="330" height="130" rx="12" fill="#edf3f9" stroke="#5c7e9e" stroke-width="1.5"/>
<text x="215" y="727" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#243f32">healing_progress</text>
<text x="215" y="749" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">PK id; patient_id → profiles.id</text>
<text x="215" y="771" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">status_type, value 1–10, timestamp</text>
<text x="215" y="793" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">History stored; UI shows latest/type</text>
<rect x="905" y="405" width="350" height="130" rx="12" fill="#edf3f9" stroke="#5c7e9e" stroke-width="1.5"/>
<text x="1080" y="442" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#243f32">mock_biometric_data</text>
<text x="1080" y="464" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">PK id; doctor_id → profiles.id</text>
<text x="1080" y="486" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">heart_rate, sleep_hours, timestamp</text>
<text x="1080" y="508" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">UI reads latest synthetic sample</text>
<rect x="455" y="885" width="410" height="125" rx="12" fill="#e5f0e9" stroke="#3b7256" stroke-width="1.5"/>
<text x="660" y="908.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#243f32">How Go connects</text>
<text x="660" y="930.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">Store interface → postgresStore</text>
<text x="660" y="952.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">database/sql + lib/pq + DATABASE_URL</text>
<text x="660" y="974.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">No browser SQL / Supabase client</text>
<text x="660" y="996.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">Apply SQL separately</text>
<rect x="50" y="115" width="330" height="160" rx="12" fill="#f2f4f5" stroke="#819098" stroke-width="1.5"/>
<text x="215" y="145" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#243f32">Database guards</text>
<text x="215" y="167" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">NOT NULL / CHECK constraints</text>
<text x="215" y="189" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">Foreign keys + role triggers</text>
<text x="215" y="211" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">Immutable profile role</text>
<text x="215" y="233" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">RLS enabled; no browser policies</text>
<text x="215" y="255" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">Backend needs appropriate privileges</text>
<rect x="905" y="115" width="350" height="155" rx="12" fill="#fff3df" stroke="#b17b2c" stroke-width="1.5"/>
<text x="1080" y="153.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#243f32">Not persisted in these tables</text>
<text x="1080" y="175.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">App sessions and eventHub</text>
<text x="1080" y="197.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">Actual uploaded file bytes</text>
<text x="1080" y="219.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">Wearable connection or LLM output</text>
<text x="1080" y="241.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">Verified identity/auth ownership</text>
