<text x="50" y="42" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#244536">ClearChart · 04 - Database relationships</text>
<text x="50" y="68" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#52655b">All tables are in public. UUID identifiers link profiles; roles distinguish patients from doctors.</text>
<polyline points="660,270 660,337.5 660,337.5 660,405" fill="none" stroke="#62786d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
