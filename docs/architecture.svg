<text x="1065" y="475.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#243f32">Present: NewPostgresStore()</text>
<text x="1065" y="497.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#243f32">sql.Open pool + PingContext</text>
