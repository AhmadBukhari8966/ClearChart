{{define "mock_scan.svg"}}<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="scan-title scan-description">

<desc id="scan-description">Synthetic cross-section illustration for testing the ClearChart patient timeline. This is not a clinical image.</desc>
